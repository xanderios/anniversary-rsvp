<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#F9D1DA">
  <title>Convite</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/img/convite_arte.jpg" as="image">
</head>
<body class="guest locked">
  <svg class="sprite" aria-hidden="true" width="0" height="0">
    <symbol id="i-heart" viewBox="0 0 24 22"><path fill="currentColor" d="M12 21C5 15 1 11 1 6.5A5.5 5.5 0 0 1 12 4.6 5.5 5.5 0 0 1 23 6.5C23 11 19 15 12 21Z"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M6 9l6 6 6-6"/></symbol>
    <symbol id="i-crown" viewBox="0 0 80 60">
      <path fill="currentColor" d="M13 44 8.5 20 24 31 40 8 56 31 71.5 20 67 44Z"/>
      <rect fill="currentColor" x="12" y="46.5" width="56" height="8" rx="1.5"/>
      <circle fill="currentColor" cx="8" cy="17" r="3.6"/><circle fill="currentColor" cx="40" cy="5" r="4"/><circle fill="currentColor" cx="72" cy="17" r="3.6"/><circle fill="currentColor" cx="24" cy="27.5" r="2.6"/><circle fill="currentColor" cx="56" cy="27.5" r="2.6"/>
      <path fill="#FFFBF2" d="M40 47.6l2.6 2.9-2.6 2.9-2.6-2.9zM26 48.4l2 2.1-2 2.1-2-2.1zM54 48.4l2 2.1-2 2.1-2-2.1zM40 22l4 7-4 7-4-7z" opacity=".85"/>
    </symbol>
    <symbol id="i-cal" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="9" width="38" height="33" rx="4"/><path d="M5 18.5h38M15 5v8M33 5v8"/></g><path fill="currentColor" d="M24 36c-4-3.2-6.2-5.4-6.2-8a3.3 3.3 0 0 1 6.2-1.5 3.3 3.3 0 0 1 6.2 1.5c0 2.6-2.2 4.8-6.2 8Z"/></symbol>
    <symbol id="i-clock" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="24" cy="24" r="19.5"/><path d="M24 12v12.5l8 5"/></g></symbol>
    <symbol id="i-pin" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M24 45S10 29.5 10 19.5a14 14 0 0 1 28 0C38 29.5 24 45 24 45Z"/><circle cx="24" cy="19.5" r="4.6"/></g></symbol>
    <symbol id="i-agenda" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M12 13v5M9.5 15.5h5"/></g></symbol>
    <symbol id="i-flourish" viewBox="0 0 140 24"><g fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M3 13c14-9 24 8 37 2s14-9 19-3c-5 1-7 4-12 3"/><path d="M137 13c-14-9-24 8-37 2s-14-9-19-3c5 1 7 4 12 3"/></g><path fill="currentColor" d="M70 5.5l3.4 6.5-3.4 6.5-3.4-6.5z"/><circle fill="currentColor" cx="70" cy="21.5" r="1.3"/></symbol>
  </svg>

  <div id="sky" aria-hidden="true"></div>
  <canvas id="gl" aria-hidden="true"></canvas>
  <div id="stills" aria-hidden="true" hidden></div>
  <div id="fade" aria-hidden="true"></div>

  <div id="hud">
    <section id="intro" hidden>
      <div class="in-card" id="in-card">
        <svg class="in-frame" id="in-frame" aria-hidden="true"><path class="fill" d=""/><path class="line" d=""/></svg>
        <svg class="in-bow" viewBox="0 0 120 70" aria-hidden="true">
          <defs><linearGradient id="in-bow-g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBD3DC"/><stop offset="1" stop-color="#F4B0BC"/></linearGradient></defs>
          <path d="M60 36C44 10 8 8 10 30c2 18 32 20 50 6Z" fill="url(#in-bow-g)"/><path d="M60 36c16-26 52-28 50-6-2 18-32 20-50 6Z" fill="url(#in-bow-g)"/>
          <path d="M22 28c12-6 26-2 36 6M98 28c-12-6-26-2-36 6" fill="none" stroke="rgba(255,255,255,.7)" stroke-width="2"/>
          <path d="M56 40c-12 8-16 22-10 28 6 2 10-12 14-24Z" fill="#F4B9C0"/><path d="M64 40c12 8 16 22 10 28-6 2-10-12-14-24Z" fill="#F4B9C0"/>
          <ellipse cx="60" cy="37" rx="9" ry="7" fill="#EE9197"/><ellipse cx="57" cy="35" rx="3" ry="2" fill="rgba(255,255,255,.6)"/>
          <path d="M16 30c-6 6-6 12 2 14M104 30c6 6 6 12-2 14" fill="none" stroke="rgba(217,99,110,.3)" stroke-width="1.2"/>
        </svg>
        <svg class="in-flower" viewBox="0 0 92 52" aria-hidden="true">
          <ellipse cx="20" cy="30" rx="16" ry="6" fill="#ABBF74" transform="rotate(-25 20 30)"/><ellipse cx="72" cy="30" rx="16" ry="6" fill="#9DB56B" transform="rotate(25 72 30)"/><ellipse cx="30" cy="40" rx="12" ry="5" fill="#C9D390" transform="rotate(-10 30 40)"/><ellipse cx="62" cy="40" rx="12" ry="5" fill="#C9D390" transform="rotate(10 62 40)"/>
          <g fill="#F9C0CF"><ellipse cx="46" cy="14" rx="7" ry="11"/><ellipse cx="46" cy="38" rx="7" ry="11"/><ellipse cx="34" cy="26" rx="11" ry="7"/><ellipse cx="58" cy="26" rx="11" ry="7"/><circle cx="37.5" cy="17.5" r="8"/><circle cx="54.5" cy="17.5" r="8"/><circle cx="37.5" cy="34.5" r="8"/><circle cx="54.5" cy="34.5" r="8"/></g>
          <circle cx="46" cy="26" r="5" fill="#F4C452"/><circle cx="44" cy="24" r="1.6" fill="#FFF3BD"/>
          <circle cx="12" cy="20" r="3" fill="#FFF7F1"/><circle cx="80" cy="18" r="3" fill="#FFF7F1"/><circle cx="8" cy="36" r="2.4" fill="#F7AEC2"/><circle cx="84" cy="36" r="2.4" fill="#F7AEC2"/>
        </svg>
        <svg class="in-sprig tr" viewBox="0 0 90 90" aria-hidden="true"><g fill="none" stroke="#9DB56B" stroke-width="2" stroke-linecap="round"><path d="M10 80C30 60 50 40 78 12"/><path d="M34 56c6-8 16-10 24-8"/><path d="M50 40c2-10 8-16 18-18"/></g><g fill="#ABBF74"><ellipse cx="26" cy="62" rx="9" ry="4" transform="rotate(-40 26 62)"/><ellipse cx="42" cy="46" rx="9" ry="4" transform="rotate(-40 42 46)"/><ellipse cx="60" cy="30" rx="8" ry="3.6" transform="rotate(-40 60 30)"/><ellipse cx="38" cy="66" rx="7" ry="3.2" transform="rotate(20 38 66)"/></g><g fill="#F9C0CF"><circle cx="58" cy="48" r="4"/><circle cx="68" cy="22" r="4"/><circle cx="76" cy="12" r="3"/></g><circle cx="58" cy="48" r="1.6" fill="#fff"/><circle cx="68" cy="22" r="1.6" fill="#fff"/></svg>
        <svg class="in-sprig bl" viewBox="0 0 90 90" aria-hidden="true"><g fill="none" stroke="#9DB56B" stroke-width="2" stroke-linecap="round"><path d="M80 10C60 30 40 50 12 78"/><path d="M56 34c-6 8-16 10-24 8"/><path d="M40 50c-2 10-8 16-18 18"/></g><g fill="#ABBF74"><ellipse cx="64" cy="28" rx="9" ry="4" transform="rotate(-40 64 28)"/><ellipse cx="48" cy="44" rx="9" ry="4" transform="rotate(-40 48 44)"/><ellipse cx="30" cy="60" rx="8" ry="3.6" transform="rotate(-40 30 60)"/></g><g fill="#F9C0CF"><circle cx="32" cy="42" r="4"/><circle cx="22" cy="68" r="4"/><circle cx="14" cy="78" r="3"/></g><circle cx="32" cy="42" r="1.6" fill="#fff"/><circle cx="22" cy="68" r="1.6" fill="#fff"/></svg>
        <p class="in-lead" id="in-lead"></p>
        <h1 class="in-name" id="in-name"></h1>
        <p class="in-poem" id="in-poem"></p>
      </div>
    </section>
    <div id="rail" aria-hidden="true" hidden><i></i></div>
    <div id="guide" hidden>
      <button id="skip" class="chip" type="button">Pular para o convite</button>
      <div id="hint"><span>Role para baixo para entrar no castelo</span><svg aria-hidden="true"><use href="#i-chev"/></svg></div>
      <p id="caption" role="status" aria-live="polite"></p>
    </div>
  </div>

  <main id="stage" hidden></main>

  <div id="loader" role="status" aria-live="polite">
    <div class="ld-in">
      <svg class="ld-crown" aria-hidden="true"><use href="#i-crown"/></svg>
      <div class="ld-name" id="ld-name"></div>
      <div class="ld-sub" id="ld-sub"></div>
      <div class="ld-bar" aria-hidden="true"><i id="ld-fill"></i></div>
      <div class="ld-txt" id="ld-txt">Preparando o jardim…</div>
    </div>
    <div class="ld-card" id="ld-motion" hidden>
      <p>Quer olhar ao redor do jardim movendo o celular?</p>
      <button class="btn pri" id="ld-yes" type="button">Permitir movimento</button>
      <button class="btn ghost" id="ld-no" type="button">Agora não</button>
    </div>
  </div>

  <div id="track" aria-hidden="true"></div>
  <!--CONVITE-->
  <script type="module" src="/src/main.js"></script>
</body>
</html>
